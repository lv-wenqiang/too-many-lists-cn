name: Deploy to GitHub Pages

on:
  push:
    branches: [main, zh-translation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        env:
          # Pinned to the version the translation was validated against.
          MDBOOK_VERSION: 0.5.2
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/bin"
          curl -sSL "$url" | tar -xzf - -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # The validator itself needs the English source tree, which this repo
      # does not contain, so CI runs its unit tests only.
      - name: Run validator unit tests
        run: python3 -m unittest discover -s tests

      - name: Build site
        run: ./scripts/build_site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
